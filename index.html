<style>:root {
--font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
--font-head: 'Syne', 'DM Sans', system-ui, sans-serif;
--ink: #0f1a14;
--canopy: #123420;
--canopy-deep: #081c12;
--leaf: #2f7d43;
--leaf-bright: #4caf50;
--sun: #f5a623;
--sun-deep: #dd8a08;
--coral: #ff6b52;
--coral-deep: #e8503a;
--cream: #f6f7f4;
--paper: #f1f3ef;
--mist: #edf3ee;
--border: #e2e7e1;
--muted: #5d6f63;
--muted-2: #8a998f;
--card: #ffffff;
--sky: #2b6cb0;
--sky-soft: #e8f1fb;
--radius-sm: 10px;
--radius: 14px;
--radius-lg: 20px;
--radius-xl: 32px;
--shadow-sm: 0 1px 2px rgba(15,26,20,0.05), 0 2px 8px rgba(15,26,20,0.05);
--shadow: 0 2px 4px rgba(15,26,20,0.04), 0 10px 28px rgba(15,26,20,0.08);
--shadow-lg: 0 4px 10px rgba(15,26,20,0.06), 0 24px 60px rgba(15,26,20,0.16);
--ease: cubic-bezier(0.16,1,0.3,1);
--gut: clamp(16px, 4vw, 32px);
--topbar-h: 62px;
--safe-b: env(safe-area-inset-bottom, 0px);
--safe-t: env(safe-area-inset-top, 0px);
--safe-l: env(safe-area-inset-left, 0px);
--safe-r: env(safe-area-inset-right, 0px);
}
@media (min-width: 641px) { :root { --topbar-h: 66px; } }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
font-family: var(--font-body);
background: var(--cream);
color: var(--ink);
min-height: calc(100vh / var(--z, 1));
-webkit-font-smoothing: antialiased;
overflow-x: hidden;
overscroll-behavior-y: none;
}
img { max-width: 100%; display: block; }
button, input, select, textarea { font-family: inherit; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
:focus-visible { outline: 2.5px solid var(--leaf-bright); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
*, *::before, *::after {
animation-duration: 0.01ms !important;
animation-iteration-count: 1 !important;
transition-duration: 0.01ms !important;
scroll-behavior: auto !important;
}
}
@keyframes fadeInUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: scale(0.94) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes floatBlob { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(22px,-18px) scale(1.06); } }
@keyframes floatBlob2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-18px,16px) scale(1.05); } }
@keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

.ad-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.ad-stat { min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 16px; background: #f7f9f5; border: 1px solid #e6ebe3; }
.ad-stat.hero { background: linear-gradient(135deg, #0f3a24, #1f6a40); border-color: transparent; color: #fff; }
.ad-stat.gold { background: linear-gradient(135deg, #fff7dc, #fffdf5); border-color: #f2d98c; }
.ad-stat.sky { background: linear-gradient(135deg, #eaf3ff, #f7fbff); border-color: #c8def5; }
.ad-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ad-ic { flex: none; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: #e3f0e7; color: #1f6a40; font-size: 13px; }
.ad-stat.hero .ad-ic { background: rgba(255,255,255,.14); color: #ffd34d; }
.ad-stat.gold .ad-ic { background: #ffe9a8; color: #7a5600; }
.ad-stat.sky .ad-ic { background: #d4e6fb; color: #1d4f91; }
.ad-stat.online .ad-ic { color: #15803d; }
.ad-l { flex: 1; min-width: 0; font: 700 12.5px/1.3 var(--font-body); color: #3e5246; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ad-stat.hero .ad-l { color: #d7ebde; }
.ad-live { flex: none; display: inline-flex; align-items: center; gap: 5px; font: 800 10px var(--font-body); letter-spacing: .6px; text-transform: uppercase; color: #15803d; }
.ad-stat.hero .ad-live { color: #9df0b9; }
.ad-live span { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: presPulse 2s ease-out infinite; }
.ad-n { font: 800 clamp(24px, 2.6vw, 32px)/1.05 var(--font-num, var(--font-body)); letter-spacing: -.02em; color: #0c1a12; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.ad-stat.hero .ad-n { color: #fff; }
.ad-sub { font: 500 12px/1.4 var(--font-body); color: #5a6a60; }
.ad-stat.hero .ad-sub { color: #cfe5d6; }
.ad-chart { margin-top: 16px; padding: 16px 18px; border-radius: 16px; border: 1px solid #e6ebe3; background: #fcfdfb; }
.ad-chart-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.ad-chart-h b { display: block; font: 800 14px var(--font-body); color: #14231a; }
.ad-chart-h small { display: block; font: 500 12.5px var(--font-body); color: #5a6a60; margin-top: 2px; }
.ad-tip { font: 500 12.5px var(--font-body); color: #2a3d31; min-height: 18px; }
.ad-tip span { color: #5a6a60; }
.ad-bars { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; height: 170px; align-items: end; border-bottom: 1px solid #dfe5dc; }
.ad-bar { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; padding: 0; border: none; background: none; cursor: pointer; }
.ad-col { width: 100%; max-width: 28px; flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
.ad-seg { display: block; width: 100%; border-radius: 4px 4px 0 0; background: #1f7a48; transition: height .5s var(--ease), background .2s; }
.ad-seg.drone { background: #3b82f6; border-radius: 4px 4px 0 0; }
.ad-seg.drone + .ad-seg { border-radius: 0; }
.ad-bar.on .ad-seg { background: #15603a; } .ad-bar.on .ad-seg.drone { background: #1d4f91; }
.ad-d { font: 600 11px var(--font-body); color: #5a6a60; padding-bottom: 4px; }
.ad-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font: 600 12px var(--font-body); color: #3e5246; }
.ad-legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: #1f7a48; margin-right: 6px; vertical-align: -1px; }
.ad-legend .sw.drone { background: #3b82f6; }
@media (min-width: 1100px) { .ad-grid { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); } .ad-bars { height: 210px; } }
@media (max-width: 560px) { .ad-grid { grid-template-columns: 1fr 1fr; gap: 8px; } .ad-stat { padding: 12px; } .ad-l { white-space: normal; } .ad-bars { gap: 3px; height: 130px; } .ad-d { font-size: 9.5px; } }
.wa-btn { background: #0f7a3f !important; color: #fff !important; }
.wa-btn.alt { background: #fff !important; color: #0f6b37 !important; }
.pc-chip.new { background: #c2410c; }
.pc-zoom { border: none; cursor: pointer; pointer-events: auto; }
.care-line .wa, a.wa, .wa { background-color: #0f7a3f !important; }
.pt-cancel { color: #b42318 !important; }
.rating-display > span { color: #5a6a60 !important; }
.shop-bio.empty { color: #5a6a60 !important; }
.ad-l { white-space: normal; overflow: visible; }
.ad-empty { font: 500 12.5px var(--font-body); color: #5a6a60; padding: 8px 0 4px; }</style>
</head>
